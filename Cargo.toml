[package]
name = "hashring-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/hashring-client",
    "crates/hashring-coordinator",
    "crates/hashring-core",
    "crates/hashring-experiment",
    "crates/hashring-node",
    "crates/hashring-redis",
    "crates/hashring-redis-lua-experimental",
]
default-members = [
    ".",
    "crates/hashring-client",
    "crates/hashring-coordinator",
    "crates/hashring-core",
    "crates/hashring-experiment",
    "crates/hashring-node",
    "crates/hashring-redis",
]
resolver = "2"

[features]
default = []
redis-lua-experimental = ["dep:hashring-redis-lua-experimental"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hashring-client = { version = "0.1.0", path = "crates/hashring-client" }
hashring-coordinator = { version = "0.1.0", path = "crates/hashring-coordinator" }
hashring-core = { version = "0.1.0", path = "crates/hashring-core" }
hashring-experiment = { version = "0.1.0", path = "crates/hashring-experiment" }
hashring-node = { version = "0.1.0", path = "crates/hashring-node" }
hashring-redis = { version = "0.1.0", path = "crates/hashring-redis" }
hashring-redis-lua-experimental = { version = "0.1.0", path = "crates/hashring-redis-lua-experimental", optional = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
tempfile = "3"
