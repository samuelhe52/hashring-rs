[package]
name = "hashring-coordinator"
version = "0.1.0"
edition = "2024"

[dependencies]
hashring-core = { version = "0.1.0", path = "../hashring-core" }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
