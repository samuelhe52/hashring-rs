[package]
name = "hashring-redis"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
hashring-client = { version = "0.1.0", path = "../hashring-client" }
hashring-core = { version = "0.1.0", path = "../hashring-core" }
hex = "0.4.3"
mlua = { version = "0.12.2", features = ["async", "lua54", "send", "vendored"] }
sha1 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tonic = { version = "0.12", default-features = false }
tracing = "0.1"

[dev-dependencies]
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
