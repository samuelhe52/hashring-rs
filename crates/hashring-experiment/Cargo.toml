[package]
name = "hashring-experiment"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
futures = "0.3"
hashring-client = { version = "0.1.0", path = "../hashring-client" }
hashring-core = { version = "0.1.0", path = "../hashring-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
blake3 = "1"
