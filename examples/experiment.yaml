# Settings for `hashring-rs experiment --config examples/experiment.yaml`.
# Every key is optional and named after an experiment flag (`_` for `-`), with
# the same values (`first-successor`, not `FirstSuccessor`). A flag given on the
# command line wins over the same key here; `--verbose` and
# `--require-clean-source` can turn a setting on but not off.
mode: availability
# Usually given per run with --output, since the directory must be new or
# empty. A relative path here is resolved against this file's directory.
# output: ../results/availability
nodes: 4
keys: 1000
value_bytes: 128
concurrency: 64
seed: 1
virtual_nodes: 128
operation_timeout_ms: 30000
migration_timeout_ms: 600000
range_move_concurrency: 16
replica_repair_concurrency: 4
prepublication_failure_grace_ms: 30000
pre_publish_delay_ms: 250
require_clean_source: false
verbose: false
desired_replication_factor: 3
minimum_admitted_copies: 1
minimum_healthy_followers: 0
max_replica_lag_ms: 5000
receipt_retention_ms: 60000
lease_duration_ms: 5000
policy: first-successor
# worker_threads: 2   # default: CPUs / (nodes + 2), at least 2
# coordinator_worker_threads: 4   # default: one per available CPU

# The `latency` mode only. The load is offered at a fixed rate, and every
# rate is one stage of the run.
# preload_keys: 100000   # the keys written before the load, and its key space
# target_rates: [5000, 10000, 20000]   # operations per second
# warmup_seconds: 10   # the start of every stage that is not counted
# duration_seconds: 60  # the length of every stage that is counted
# mix: "90:9:1"   # the GET:PUT:DELETE share of the requests
# key_distribution: zipf:0.99   # uniform, zipf:<theta>, hotspot:<keys>:<traffic>
# max_in_flight: 4096   # a request over the limit is dropped, not queued

# The `availability` mode only. Every round kills the current owner of the
# probe key and then joins a replacement, so the run needs one spare node per
# round: `nodes` is the initial members plus those spares.
availability_rounds: 1

# The `scaling` mode only.
# scaling_scenario: round-trip   # round-trip, grow, shrink, replace, churn, or control
# scaling_load_mode: closed      # closed or open
# scaling_open_rate: 1000        # total operations per second in open mode
# initial_nodes: 9               # default: peak - 1 for grow/round-trip/replace, peak for shrink/control,
#                                #          peak - 3 for churn
# scaling_write_rate: 200        # closed-loop one-shot writes and deletes per second; reads are not paced
# scaling_pool_seconds: 120      # how long one transition's one-shot pools must last
# scaling_post_seconds: 10       # how long the load keeps running after a change (the control window)

# Forwarded to every data node the run starts; see the node flags.
max_dedup_bytes: 134217728              # 128 MiB
max_value_bytes: 8388608                # 8 MiB
max_pending_replication_bytes: 67108864 # 64 MiB
max_migration_journal_bytes: 16777216   # 16 MiB
replication_stream_queue_capacity: 32
required_ack_timeout_ms: 2000
replication_rpc_timeout_ms: 2000
replication_batch_linger_ms: 2
