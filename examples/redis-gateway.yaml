# Settings for `hashring-rs redis-gateway --config examples/redis-gateway.yaml`.
# Every key is optional and named after a `redis-gateway` flag (`_` for `-`).
# A flag given on the command line wins over the same key here.
listen: 127.0.0.1:6379
coordinator: http://127.0.0.1:50050
# How long one command may take against the cluster before it is reported as
# not finished. Redis has no such deadline; a proxy in front of a migrating
# cluster does.
deadline_ms: 5000
# worker_threads: 4   # default: one per available CPU

# Require AUTH before a connection may read or write. Leave it unset here and
# set HASHRING_GATEWAY_PASSWORD instead to keep the secret out of both the file
# and the process list.
# requirepass: change-me
